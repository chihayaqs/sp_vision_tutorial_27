# TODO: 在此补全参数
planner_server:
  ros__parameters:
    costmap_topic: "/global_costmap"
    local_costmap_topic: "/local_costmap/costmap"
    path_topic: "/global_path"
    plugin_name: "AStar"
    plugin_type: "sp_global_planner/AStarPlanner"

    AStar:
      lethal_cost: 100
      cost_weight: 3.0
      smoothing_data_weight: 0.015
      smoothing_smooth_weight: 0.30
      smoothing_iterations: 150
      path_spacing: 0.05

esdf_map_publisher:
  ros__parameters:
    map_yaml: "sp_nav_bringup/map/maze_map.yaml"
    frame_id: "map"
    publish_rate_hz: 1.0
    unknown_as_obstacle: false
    robot_radius: 0.25
    margin: 0.15
    d_safe: 0.70
    w: 12.0
    unknown_cost: 100
    visualize_esdf: false

controller_server:
  ros__parameters:
    local_path_topic: "/global_path"
    odom_topic: "/Odometry"
    odom_frame_id: "lidar_odom"
    map_frame_id: "map"
    cmd_vel_topic: "/sentry/cmd_vel"
    base_frame_id: "base_link"
    control_frequency: 50.0

    plugin_name: "MpcController"
    plugin_type: "MpcController"

    MpcController:
      base_frame_id: "base_link"
      max_speed: 1.6
      max_acceleration: 1.0
      lateral_acceleration: 0.8
      command_limit: 2.0
      actual_speed_limit: 2.0
      actual_acceleration_limit: 2.0
      position_weight: 30.0
      velocity_weight: 2.0
      input_weight: 0.12
      terminal_position_weight: 12.0
      terminal_velocity_weight: 2.0
      prediction_steps: 80
      move_steps: 4
      qp_iterations: 800
      qp_rho: 0.03
      command_delay: 0.1667
      filter_time_constant: 0.08
      velocity_time_constant: 0.2923
      observer_gain: 1.0

sp_decision:
  ros__parameters:
    tick_rate_hz: 10.0
    tree_files:
      - "sp_decision/decision_trees/click_nav.xml"
    bt_plugins:
      - "nav_to_pose_bt_node"
      - "condition_judge_bt_node"
      - "wait_duration_bt_node"
      - "gimbal_control_bt_node"
      - "chassis_mode_bt_node"
      - "set_double_bt_node"

nav_interface_node:
  ros__parameters:
    default_bt_xml: "sp_nav_bt/nav_bt/default_nav_with_fallback.xml"
    enable_bt_cout_logger: false
    bt_plugins:
      - "nav_compute_path_service"
      - "nav_state_track"
      - "nav_rate_control"
      - "nav_repeat_sequence"
      - "nav_get_pose"
      - "nav_set_control_enable"
